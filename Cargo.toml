[package]
name = "oddsradar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only cross-venue prediction-market spread radar"
repository = "https://github.com/toolazytoname/oddsradar"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"
