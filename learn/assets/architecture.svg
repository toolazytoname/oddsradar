<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
  <rect width="960" height="420" fill="#0f1419"/>
  <text x="32" y="36" fill="#8aa0b4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">oddsradar · architecture</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" text-anchor="middle">
    <rect x="40" y="80" width="180" height="56" rx="10" fill="#1a2430" stroke="#3ee0c4"/>
    <text x="130" y="114" fill="#e8eef4">markets.csv map</text>
    <rect x="40" y="160" width="180" height="56" rx="10" fill="#1a2430" stroke="#5b6b7a"/>
    <text x="130" y="186" fill="#e8eef4">quotes JSON</text>
    <text x="130" y="204" fill="#8aa0b4" font-size="11">fixture</text>
    <rect x="40" y="240" width="180" height="56" rx="10" fill="#1a2430" stroke="#5b6b7a"/>
    <text x="130" y="266" fill="#e8eef4">Polymarket / Kalshi</text>
    <text x="130" y="284" fill="#8aa0b4" font-size="11">live.rs</text>
    <rect x="300" y="160" width="190" height="70" rx="10" fill="#1a2430" stroke="#e8a54b"/>
    <text x="395" y="190" fill="#e8eef4">parse_prob</text>
    <text x="395" y="208" fill="#8aa0b4" font-size="11">→ millionths i64</text>
    <rect x="560" y="160" width="180" height="70" rx="10" fill="#1a2430" stroke="#e8a54b"/>
    <text x="650" y="190" fill="#e8eef4">compare_event</text>
    <text x="650" y="208" fill="#8aa0b4" font-size="11">max − min</text>
    <rect x="800" y="100" width="120" height="50" rx="10" fill="#1a2430" stroke="#3ee0c4"/>
    <text x="860" y="130" fill="#e8eef4">spread</text>
    <rect x="800" y="170" width="120" height="50" rx="10" fill="#1a2430" stroke="#5b6b7a"/>
    <text x="860" y="200" fill="#e8eef4">ok</text>
    <rect x="800" y="240" width="120" height="50" rx="10" fill="#1a2430" stroke="#5b6b7a"/>
    <text x="860" y="270" fill="#e8eef4">quote</text>
    <path d="M220 108 H260 V195 H300" stroke="#3ee0c4" fill="none"/>
    <path d="M220 188 H300" stroke="#5b6b7a" fill="none"/>
    <path d="M220 268 H260 V195" stroke="#5b6b7a" fill="none"/>
    <path d="M490 195 H560" stroke="#e8a54b" fill="none"/>
    <path d="M740 195 H800" stroke="#3ee0c4" fill="none"/>
    <text x="32" y="360" fill="#8aa0b4" font-size="12" text-anchor="start">The CSV map is the product: it says which markets are the same event. APIs only supply strings.</text>
    <text x="32" y="382" fill="#8aa0b4" font-size="12" text-anchor="start">One venue → quote. Two venues over threshold → spread. Never places a bet.</text>
  </g>
